<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24">
  <!-- a big snowflake falling over the page (modes/january/mode.css): six arms, each with two small branches;
       a thin blue-grey edge, so it is seen over the white snow too -->
  <defs>
    <path id="arm" d="M0 0 V-10 M0 -5.5 L-3 -8.5 M0 -5.5 L3 -8.5"/>
    <g id="flake">
      <use href="#arm"/>
      <use href="#arm" transform="rotate(60)"/>
      <use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/>
      <use href="#arm" transform="rotate(240)"/>
      <use href="#arm" transform="rotate(300)"/>
    </g>
  </defs>
  <g fill="none" stroke-linecap="round">
    <use href="#flake" stroke="#a9bfd4" stroke-width="3.4"/>
    <use href="#flake" stroke="#ffffff" stroke-width="1.8"/>
  </g>
</svg>
